name: AnzeigenPiraten Scan

# The scanner is the "backend" of this otherwise fully static GitHub Pages site.
# Manual hosted scan only. Frequent scans that use local Ollama run from the
# Windows scheduled task and publish their JSON changes by pushing to main.

on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Alle gefundenen Anzeigen neu kategorisieren'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: anzeigenpiraten-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run unit tests
        working-directory: scripts
        run: node --test

      - name: Scan and classify products
        working-directory: scripts
        env:
          # Add OPENAI_API_KEY as a repository secret to enable AI classification.
          # Without it listings are stored with an unknown product identity.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Optional overrides - set these as repository *variables*.
          AI_BASE_URL: ${{ vars.AI_BASE_URL }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          # Empty on schedule runs; "true" when the manual input is checked.
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: node scan.mjs

      - name: Commit refreshed data
        run: |
          git config user.name  "anzeigenpiraten-bot"
          git config user.email "anzeigenpiraten-bot@users.noreply.github.com"

          git add data
          if git diff --staged --quiet; then
            echo "No data changes – nothing to commit."
            exit 0
          fi

          git commit -m "data: refresh deals ($(date -u '+%Y-%m-%d %H:%M UTC'))"

          # A concurrent run may have pushed in the meantime.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
          git push
